<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KIF Viewer (branch)</title>
  <style>
    :root{
      --sq: 44px;
      --wood1:#f1cc84;
      --wood2:#e4b862;
      --woodLine:#5c3718;
      --handWood1:#efd08a;
      --handWood2:#dfb96a;
      --handChip:#f8edd2;
      --cellLine: rgba(64,37,15,.82);
      --panel:#ffffff;
      --shadow: 0 10px 26px rgba(0,0,0,.10);
    }
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      margin: 16px;
      background: #f6f6f6;
      color:#111;
    }
    h1{ font-size: 18px; margin: 0 0 12px; }
    .row{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
    .panel{
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      padding: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button{
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #cfcfcf;
      background: #fff;
      cursor: pointer;
    }
    button:active{ transform: translateY(1px); }
    input[type="range"]{ width: min(560px, 92vw); }
    textarea{
      width: min(560px, 92vw);
      height: 140px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .meta{ font-size: 12px; color:#444; white-space: pre-wrap; margin-top:10px; }

    /* --- board area layout (left hand / board / right hand) --- */
    .boardArea{
      display:grid;
      grid-template-columns: 150px auto 150px;
      gap: 12px;
      align-items:start;
    }
    .handBox{
      border-radius: 12px;
      padding: 10px 10px 8px;
      background: linear-gradient(145deg, var(--handWood1), var(--handWood2));
      border: 1px solid rgba(92,55,24,.34);
      box-shadow: 0 8px 20px rgba(86,55,24,.18);
      min-height: calc(var(--sq) * 3);
    }
    .handTitle{
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 6px;
      display:flex;
      justify-content: space-between;
      align-items: baseline;
      color:#4c3318;
    }
    .handGrid{
      display:flex;
      flex-wrap:wrap;
      gap: 6px;
      align-items:center;
    }
    .handPiece{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width: 38px;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(102,60,26,.30);
      background: linear-gradient(180deg, var(--handChip), #f1dfba);
      font-family: "Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP","Yu Mincho",serif;
      font-size: 16px;
      letter-spacing: .02em;
    }
    .handPiece small{ font-size: 12px; opacity:.75; margin-left:6px; }

    /* position rules you requested */
    .handLeft{ align-self:start; } /* 後手: 左上寄り */
    .handRight{ align-self:end; }  /* 先手: 右下寄り */

    /* --- board styling --- */
    .boardWrap{
      display:flex;
      flex-direction:column;
      gap: 10px;
      align-items:center;
    }
    .boardFrame{
      padding: 10px;
      border-radius: 14px;
      background:
        linear-gradient(150deg, var(--wood1), var(--wood2));
      box-shadow: 0 10px 24px rgba(79,49,20,.26);
      border: 1px solid rgba(92,55,24,.42);
      cursor: ew-resize;
    }
    table.board{
      border-collapse: collapse;
      user-select:none;
      background:
        linear-gradient(180deg, rgba(255,236,190,.26), rgba(210,144,67,.10)),
        #ebbe66;
    }
    table.board td{
      width: var(--sq);
      height: var(--sq);
      border: 1px solid var(--cellLine);
      text-align:center;
      vertical-align:middle;
      font-size: 20px;
      position:relative;
    }
    table.board td::after{
      content:"";
      position:absolute;
      inset:0;
      box-shadow:
        inset 0 1px 0 rgba(255,246,217,.18),
        inset 0 -1px 0 rgba(150,95,35,.10);
      pointer-events:none;
    }
    table.board td .gote{
      display:inline-block;
      transform: rotate(180deg);
    }
    table.board td .piece{
      font-family: "Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP","Yu Mincho",serif;
      font-weight: 700;
      color: #1f1a12;
      text-shadow: 0 1px 0 rgba(255,245,220,.14);
    }
    table.board td.lastFrom{
      background: rgba(115, 72, 28, .18);
    }
    table.board td.lastTo{
      background: rgba(255, 238, 178, .44);
    }
    table.board td.lastTo .piece{
      animation: piecePop .17s ease-out;
    }
    @keyframes piecePop{
      from{ transform: translateY(3px) scale(.88); opacity:.7; }
      to{ transform: translateY(0) scale(1); opacity:1; }
    }

    .small{ font-size: 12px; color:#666; }
    .kbdHelp{ margin-top: 2px; opacity: .9; }
    .movelist{ max-height: calc(var(--sq) * 9 + 92px); overflow:auto; width: min(560px, 92vw); }
    .movelist ol{ margin:0; padding-left:22px; }
    .movelist li{ padding: 4px 6px; border-radius: 8px; cursor:pointer; }
    .movelist li:hover{ background:#f3f3f3; }
    .movelist li.active{ background:#e7efff; }
    .tagBranch{
      display:inline-block;
      margin-left: 8px;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #d7d7d7;
      background:#fff;
      color:#444;
    }
    .branchBar{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:center;
    }
    select{
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #cfcfcf;
      background:#fff;
    }

    @media (max-width: 960px) {
      .boardArea {
        grid-template-columns: 1fr;
      }
      .handLeft,
      .handRight {
        align-self: stretch;
      }
      .movelist {
        max-height: 320px;
      }
    }
  </style>
</head>
<body>
  <h1>簡易 棋譜再生（KIF / 分岐つき）</h1>

  <div class="row">
    <div class="panel">
      <div class="controls">
        <!-- iOSで選べない時があるなら accept を消すのが最強 -->
        <input id="file" type="file" accept=".kif,.kifu,.txt,text/plain,application/octet-stream" />
        <button id="btnSample" title="同じリポジトリに piyo_prev_game.kif を置いた場合">サンプル読込</button>
      </div>
      <div style="margin-top:10px">
        <div class="small">ファイルが面倒なら、ここにKIFを貼って「貼付読込」でもOK。</div>
        <textarea id="kifText" placeholder="ここにKIFを貼り付け"></textarea>
        <div class="controls" style="margin-top:8px">
          <button id="btnLoadText">貼付読込</button>
          <button id="btnReset">初期局面</button>
          <button id="btnCopyLineKif">このラインをKIFコピー</button>
          <button id="btnCopyUrl">局面URLコピー</button>
        </div>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="panel">
      <div class="boardArea">
        <div class="handBox handLeft">
          <div class="handTitle"><span>後手</span><span class="small" id="goteNote"></span></div>
          <div class="handGrid" id="handGote"></div>
        </div>

        <div class="boardWrap">
          <div class="boardFrame">
            <table class="board" id="board"></table>
          </div>

          <div class="branchBar">
            <span class="small" id="branchHint">分岐：なし</span>
            <select id="branchSelect" style="display:none"></select>
          </div>

          <div class="controls">
            <button id="btnFirst">|&lt;</button>
            <button id="btnPrev">&lt;</button>
            <button id="btnNext">&gt;</button>
            <button id="btnLast">&gt;|</button>
          </div>
          <div class="controls">
            <input id="slider" type="range" min="0" max="0" value="0" />
            <span id="plyLabel" class="small">0手目</span>
          </div>
          <div class="small" id="moveLabel"></div>
          <div class="small kbdHelp">⌨ ←/→:1手  ↑/↓:10手  Home/End  Space/Shift+Space</div>
        </div>

        <div class="handBox handRight">
          <div class="handTitle"><span>先手</span><span class="small" id="senteNote"></span></div>
          <div class="handGrid" id="handSente"></div>
        </div>
      </div>
    </div>

    <div class="panel movelist">
      <div class="small" style="margin-bottom:6px">手順（タップで移動）</div>
      <ol id="moves"></ol>
    </div>
  </div>

<script>
(() => {
  // ---- Helpers: text decode (cp932/shift-jis)
  function decodeKif(buf) {
    const encs = ["shift-jis", "cp932", "utf-8"];
    for (const enc of encs) {
      try {
        const td = new TextDecoder(enc, { fatal: false });
        const txt = td.decode(buf);
        if (txt && (txt.includes("手数----指手") || txt.includes("手数") || txt.includes("先手") || txt.includes("後手"))) return txt;
      } catch (_) {}
    }
    return new TextDecoder("utf-8").decode(buf);
  }

  // ---- Shogi representation
  const PIECE = {
    P:"歩", L:"香", N:"桂", S:"銀", G:"金", B:"角", R:"飛", K:"玉",
    pP:"と", pL:"杏", pN:"圭", pS:"全", pB:"馬", pR:"龍",
  };
  function promote(kind){
    if (kind === "P") return "pP";
    if (kind === "L") return "pL";
    if (kind === "N") return "pN";
    if (kind === "S") return "pS";
    if (kind === "B") return "pB";
    if (kind === "R") return "pR";
    return kind;
  }
  function unpromote(kind){
    if (kind === "pP") return "P";
    if (kind === "pL") return "L";
    if (kind === "pN") return "N";
    if (kind === "pS") return "S";
    if (kind === "pB") return "B";
    if (kind === "pR") return "R";
    return kind;
  }
  function isPromoted(kind){ return kind.startsWith("p"); }

  function emptyBoard() {
    return Array.from({length:10}, () => Array(10).fill(null));
  }

  function initStartpos() {
    const b = emptyBoard();
    const ranks = [
      "lnsgkgsnl",
      "1r5b1",
      "ppppppppp",
      "9",
      "9",
      "9",
      "PPPPPPPPP",
      "1B5R1",
      "LNSGKGSNL",
    ];
    for (let r=1; r<=9; r++){
      const row = ranks[r-1];
      let f = 9;
      for (let i=0; i<row.length; i++){
        const ch = row[i];
        if (/\d/.test(ch)) { f -= Number(ch); continue; }
        const side = (ch === ch.toUpperCase()) ? "b" : "w";
        const pc = ch.toUpperCase();
        const kind = pc === "P" ? "P" :
                     pc === "L" ? "L" :
                     pc === "N" ? "N" :
                     pc === "S" ? "S" :
                     pc === "G" ? "G" :
                     pc === "B" ? "B" :
                     pc === "R" ? "R" : "K";
        b[r][f] = { side, kind };
        f -= 1;
      }
    }
    const hands = { b:{}, w:{} };
    return { board:b, hands, stm:"b", lastFrom:null, lastTo:null };
  }

  function clonePos(pos){
    const b2 = emptyBoard();
    for (let r=1;r<=9;r++) for (let f=1;f<=9;f++){
      const p = pos.board[r][f];
      b2[r][f] = p ? { side:p.side, kind:p.kind } : null;
    }
    const h2 = { b:{}, w:{} };
    for (const s of ["b","w"]) for (const k in pos.hands[s]) h2[s][k] = pos.hands[s][k];
    return {
      board:b2,
      hands:h2,
      stm:pos.stm,
      lastFrom: pos.lastFrom ? { ...pos.lastFrom } : null,
      lastTo: pos.lastTo ? { ...pos.lastTo } : null,
    };
  }

  // ---- KIF parsing (main + variations "変化：N手")
  const FW_DIGITS = "０１２３４５６７８９";
  const HW_DIGITS = "0123456789";
  const KAN_RANK = { "一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9 };
  const SPECIAL_MOVES = new Set([
    "投了", "中断", "千日手", "持将棋", "詰み", "入玉勝ち",
    "切れ負け", "反則勝ち", "反則負け", "不戦勝", "不戦敗",
  ]);

  function toAsciiDigits(s) {
    return String(s || "").replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  }

  function compactMoveText(s) {
    return String(s || "").replace(/[ \t\u3000]/g, "");
  }

  function isSpecialMove(mvStr) {
    return SPECIAL_MOVES.has(compactMoveText(mvStr));
  }

  function parseDest(s, lastTo) {
    s = compactMoveText(s);
    if (s.startsWith("同")) {
      if (!lastTo) return null;
      return { f:lastTo.f, r:lastTo.r, rest: s.replace(/^同[\s　]*/, "") };
    }
    const fch = s[0], rch = s[1];
    let f = FW_DIGITS.indexOf(fch);
    if (!(f >= 1 && f <= 9)) f = HW_DIGITS.indexOf(fch);
    const r = KAN_RANK[rch];
    if (!(f>=1 && f<=9 && r>=1 && r<=9)) return null;
    return { f, r, rest: s.slice(2) };
  }

  function parsePieceAndFlags(rest) {
    rest = compactMoveText(rest);

    const tokens = [
      ["成銀","pS"], ["成桂","pN"], ["成香","pL"], ["成歩","pP"],
      ["と","pP"], ["馬","pB"], ["龍","pR"], ["竜","pR"],
      ["飛","R"], ["角","B"], ["金","G"], ["銀","S"], ["桂","N"], ["香","L"], ["歩","P"], ["玉","K"], ["王","K"],
    ];
    let kind = null;
    let tail = "";
    for (const [t,k] of tokens){
      if (rest.startsWith(t)) { kind = k; tail = rest.slice(t.length); break; }
    }
    if (!kind) return null;

    const isDrop = tail.includes("打");
    const forceNoProm = tail.includes("不成");

    let prom = false;
    if (!forceNoProm && tail.includes("成")) prom = true;
    if (forceNoProm) prom = false;
    if (isPromoted(kind)) prom = false;

    const hints = {
      right: tail.includes("右"),
      left: tail.includes("左"),
      straight: tail.includes("直"),
      sideways: tail.includes("寄"),
      up: tail.includes("上") || tail.includes("行"),
      down: tail.includes("引"),
    };
    return { kind, prom, isDrop, hints };
  }

  function parseMoveLine(line) {
    //  11 ８七歩打 ( 0:01/00:00:06)
    //   1 ２六歩(27)( 0:01/00:00:01)
    const strict = line.match(/^\s*([0-9０-９]+)\s+(.+?)\s*(?:[（(]([0-9０-９]{2})[)）])?\s*(?:[（(]|$)/);
    if (strict) {
      return {
        no: Number(toAsciiDigits(strict[1])),
        mvStr: strict[2].trim(),
        from: strict[3] ? toAsciiDigits(strict[3]) : null,
        raw: line,
      };
    }
    const legacy = line.match(/^\s*([0-9０-９]+)\s+(.+?)\s*$/);
    if (legacy) {
      return {
        no: Number(toAsciiDigits(legacy[1])),
        mvStr: legacy[2].trim(),
        from: null,
        raw: line,
      };
    }
    return null;
  }

  function parseKifWithBranches(text) {
    const lines = text.split(/\r?\n/);
    const meta = {};
    let inMoves = false;

    const mainMoves = [];
    const variations = []; // { startNo, moves:[] }

    let curVar = null;

    for (const line0 of lines) {
      const line = line0.trimEnd();
      const t = line.trim();
      if (!t) continue;

      if (t.includes("手数----指手")) { inMoves = true; continue; }

      if (!inMoves) {
        const m = t.match(/^([^：:]+)[：:](.*)$/);
        if (m) meta[m[1].trim()] = m[2].trim();
        continue;
      }

      if (t.startsWith("*")) continue;

      const vh = t.match(/^変化[：:]\s*([0-9０-９]+)\s*手/);
      if (vh && Number.isFinite(Number(toAsciiDigits(vh[1])))) {
        if (curVar) variations.push(curVar);
        curVar = { startNo: Number(toAsciiDigits(vh[1])), moves: [] };
        continue;
      }

      const mv = parseMoveLine(line);
      if (!mv) continue;

      if (curVar) curVar.moves.push(mv);
      else mainMoves.push(mv);
    }

    if (curVar) variations.push(curVar);

    // map variations to ply index (start ply = startNo-1)
    const varMap = new Map(); // ply -> array of variations
    for (const v of variations) {
      const ply = Math.max(0, v.startNo - 1);
      if (!varMap.has(ply)) varMap.set(ply, []);
      varMap.get(ply).push(v);
    }

    return { meta, mainMoves, varMap };
  }

  // ---- Move legality (simple) for inference when from missing
  function dir(side){ return side === "b" ? -1 : 1; }
  function inside(f,r){ return f>=1 && f<=9 && r>=1 && r<=9; }

  function canReach(board, side, kind, fromF, fromR, toF, toR) {
    const df = toF - fromF;
    const dr = toR - fromR;
    const d = dir(side);

    function clearLine(stepF, stepR) {
      let f = fromF + stepF, r = fromR + stepR;
      while (f !== toF || r !== toR) {
        if (!inside(f,r)) return false;
        if (board[r][f]) return false;
        f += stepF; r += stepR;
      }
      return true;
    }

    if (kind === "pP" || kind === "pL" || kind === "pN" || kind === "pS" || kind === "G") {
      return (
        (df===0 && dr===d) ||
        (Math.abs(df)===1 && dr===d) ||
        (Math.abs(df)===1 && dr===0) ||
        (df===0 && dr===-d)
      );
    }
    if (kind === "S") {
      return (
        (df===0 && dr===d) ||
        (Math.abs(df)===1 && dr===d) ||
        (Math.abs(df)===1 && dr===-d)
      );
    }
    if (kind === "K") return Math.abs(df)<=1 && Math.abs(dr)<=1 && !(df===0 && dr===0);
    if (kind === "P") return df===0 && dr===d;
    if (kind === "N") return (Math.abs(df)===1 && dr===2*d);
    if (kind === "L") {
      if (df!==0) return false;
      if ((toR-fromR)*d <= 0) return false;
      return clearLine(0, d);
    }
    if (kind === "B" || kind === "pB") {
      if (Math.abs(df) === Math.abs(dr) && df!==0) {
        const stepF = df>0?1:-1;
        const stepR = dr>0?1:-1;
        if (!clearLine(stepF, stepR)) return false;
        return true;
      }
      if (kind === "pB") return (Math.abs(df)===1 && dr===0) || (Math.abs(dr)===1 && df===0);
      return false;
    }
    if (kind === "R" || kind === "pR") {
      if ((df===0 && dr!==0) || (dr===0 && df!==0)) {
        const stepF = df===0 ? 0 : (df>0?1:-1);
        const stepR = dr===0 ? 0 : (dr>0?1:-1);
        if (!clearLine(stepF, stepR)) return false;
        return true;
      }
      if (kind === "pR") return Math.abs(df)===1 && Math.abs(dr)===1;
      return false;
    }
    return false;
  }

  function narrowCandidates(list, predicate) {
    const narrowed = list.filter(predicate);
    return narrowed.length ? narrowed : list;
  }

  function collectMoveCandidates(board, side, wantBase, toF, toR) {
    const out = [];
    for (let r=1; r<=9; r++) {
      for (let f=1; f<=9; f++) {
        const p = board[r][f];
        if (!p || p.side !== side) continue;
        if (unpromote(p.kind) !== wantBase) continue;
        if (!canReach(board, side, p.kind, f, r, toF, toR)) continue;
        out.push({ f, r, p });
      }
    }
    return out;
  }

  function pickMoveCandidate(candidates, side, toF, toR, hints) {
    if (!candidates.length) return null;
    let list = candidates.slice();

    if (hints?.straight) list = narrowCandidates(list, (c) => c.f === toF);
    if (hints?.sideways) list = narrowCandidates(list, (c) => c.r === toR);
    if (hints?.up) list = narrowCandidates(list, (c) => side === "b" ? c.r > toR : c.r < toR);
    if (hints?.down) list = narrowCandidates(list, (c) => side === "b" ? c.r < toR : c.r > toR);

    if (hints?.right) {
      const rightFile = side === "b"
        ? Math.min(...list.map((c) => c.f))
        : Math.max(...list.map((c) => c.f));
      list = list.filter((c) => c.f === rightFile);
    }
    if (hints?.left) {
      const leftFile = side === "b"
        ? Math.max(...list.map((c) => c.f))
        : Math.min(...list.map((c) => c.f));
      list = list.filter((c) => c.f === leftFile);
    }

    list.sort((a, b) => {
      const da = Math.abs(a.f - toF) + Math.abs(a.r - toR);
      const db = Math.abs(b.f - toF) + Math.abs(b.r - toR);
      if (da !== db) return da - db;
      if (a.f !== b.f) return side === "b" ? a.f - b.f : b.f - a.f;
      return side === "b" ? b.r - a.r : a.r - b.r;
    });
    return list[0] || null;
  }

  function applyMove(pos, mvObj) {
    const next = clonePos(pos);
    const side = next.stm;

    if (isSpecialMove(mvObj.mvStr)) {
      next.lastFrom = null;
      return { next, ok:true, terminal:true };
    }

    const destParsed = parseDest(mvObj.mvStr, next.lastTo);
    if (!destParsed) return { next, ok:false };
    const { f:toF, r:toR, rest } = destParsed;

    const pf = parsePieceAndFlags(rest);
    if (!pf) return { next, ok:false };

    let { kind, prom } = pf;
    const isDrop = pf.isDrop || mvObj.from === "00";

    const target = next.board[toR][toF];
    if (target && target.side === side) return { next, ok:false };
    if (target && target.side !== side) {
      const capBase = unpromote(target.kind);
      next.hands[side][capBase] = (next.hands[side][capBase] || 0) + 1;
    }

    let fromF = null, fromR = null;
    if (!isDrop && mvObj.from) {
      fromF = Number(mvObj.from[0]);
      fromR = Number(mvObj.from[1]);
    }

    if (isDrop) {
      const base = unpromote(kind);
      if ((next.hands[side][base] || 0) > 0) next.hands[side][base] -= 1;
      next.board[toR][toF] = { side, kind: base };
      next.lastFrom = null;
    } else {
      let piece = null;
      if (fromF && fromR) piece = next.board[fromR][fromF];

      if (!piece || piece.side !== side) {
        const wantBase = unpromote(kind);
        const candidates = collectMoveCandidates(next.board, side, wantBase, toF, toR);
        const found = pickMoveCandidate(candidates, side, toF, toR, pf.hints);
        if (found) { fromF = found.f; fromR = found.r; piece = found.p; }
        else { piece = { side, kind: wantBase }; fromF = null; fromR = null; }
      }

      if (fromF && fromR) next.board[fromR][fromF] = null;

      let movedKind = piece.kind;
      if (prom) movedKind = promote(unpromote(movedKind));
      next.board[toR][toF] = { side, kind: movedKind };
      next.lastFrom = (fromF && fromR) ? { f:fromF, r:fromR } : null;
    }

    next.lastTo = { f:toF, r:toR };
    next.stm = (side === "b") ? "w" : "b";
    return { next, ok:true, terminal:false };
  }

  // ---- UI state: mainline + branch selections
  let kif = null;           // {meta, mainMoves, varMap}
  let branchChoice = {};    // ply -> selected index (0=main continuation, 1..=variation#)
  let pathMoves = [];       // effective move list after applying branch choices
  let positions = [];       // positions[ply]
  let curPly = 0;

  // elements
  const elBoard = document.getElementById("board");
  const elMoves = document.getElementById("moves");
  const elSlider = document.getElementById("slider");
  const elPlyLabel = document.getElementById("plyLabel");
  const elMoveLabel = document.getElementById("moveLabel");
  const elMeta = document.getElementById("meta");
  const elFile = document.getElementById("file");
  const elKifText = document.getElementById("kifText");
  const elHandGote = document.getElementById("handGote");
  const elHandSente = document.getElementById("handSente");
  const elBranchHint = document.getElementById("branchHint");
  const elBranchSelect = document.getElementById("branchSelect");
  const elBoardFrame = document.querySelector(".boardFrame");
  const elMovePanel = document.querySelector(".panel.movelist");

  function renderBoard(pos) {
    elBoard.innerHTML = "";
    for (let r=1; r<=9; r++) {
      const tr = document.createElement("tr");
      for (let f=9; f>=1; f--) {
        const td = document.createElement("td");
        if (pos.lastFrom && pos.lastFrom.f === f && pos.lastFrom.r === r) td.classList.add("lastFrom");
        if (pos.lastTo && pos.lastTo.f === f && pos.lastTo.r === r) td.classList.add("lastTo");
        const p = pos.board[r][f];
        if (p) {
          const span = document.createElement("span");
          span.className = "piece";
          const k = p.kind;
          const base = unpromote(k);
          const label = (isPromoted(k) ? PIECE[k] : PIECE[base]) || "?";
          span.textContent = label;
          if (p.side === "w") span.classList.add("gote");
          td.appendChild(span);
        }
        tr.appendChild(td);
      }
      elBoard.appendChild(tr);
    }
  }

  function renderHands(pos) {
    function fill(el, side){
      el.innerHTML = "";
      const order = ["R","B","G","S","N","L","P"];
      let any = false;
      for (const k of order) {
        const n = pos.hands[side][k] || 0;
        if (n<=0) continue;
        any = true;
        const d = document.createElement("span");
        d.className = "handPiece";
        d.innerHTML = `${PIECE[k]}<small>×${n}</small>`;
        el.appendChild(d);
      }
      if (!any) el.innerHTML = `<span class="small">なし</span>`;
    }
    fill(elHandGote, "w");
    fill(elHandSente, "b");
  }

  function computeEffectivePath() {
    // Traverse current continuation line and allow branch selection at every reachable ply.
    const out = [];
    let activeLine = kif.mainMoves;
    let lineOffset = 0; // activeLine[0] corresponds to this ply

    while (true) {
      const ply = out.length;
      const varList = kif.varMap.get(ply) || null;
      const rawChoice = Number(branchChoice[ply] ?? 0);
      const choice = Number.isFinite(rawChoice) ? rawChoice : 0;

      if (varList && choice > 0 && choice <= varList.length) {
        activeLine = varList[choice - 1].moves;
        lineOffset = ply;
      }

      const idx = ply - lineOffset;
      if (idx < 0 || idx >= activeLine.length) break;
      out.push(activeLine[idx]);
    }
    return out;
  }

  function buildPositions() {
    pathMoves = computeEffectivePath();
    positions = [];
    let pos = initStartpos();
    positions.push(clonePos(pos));
    const realizedMoves = [];
    for (const m of pathMoves) {
      const res = applyMove(pos, m);
      if (!res.ok) break;
      pos = res.next;
      realizedMoves.push(m);
      positions.push(clonePos(pos));
      if (res.terminal) break;
    }
    pathMoves = realizedMoves;
    elSlider.max = String(Math.max(0, positions.length-1));
    renderMovelist();
    setPly(Math.min(curPly, positions.length-1));
  }

  function renderMovelist() {
    elMoves.innerHTML = "";
    pathMoves.forEach((m, idx) => {
      const li = document.createElement("li");
      const ply = idx + 1;
      li.textContent = `${ply}. ${m.mvStr}${m.from ? " ("+m.from+")" : ""}`;

      // show branch badge if this ply-1 has variations
      const varList = kif.varMap.get(ply-1);
      if (varList && varList.length) {
        const b = document.createElement("span");
        b.className = "tagBranch";
        const sel = branchChoice[ply-1] ?? 0;
        b.textContent = sel === 0 ? `分岐(${varList.length})` : `分岐→${sel}/${varList.length}`;
        li.appendChild(b);
      }

      li.dataset.ply = String(ply);
      li.addEventListener("click", () => setPly(ply));
      elMoves.appendChild(li);
    });
    highlightMovelist();
  }

  function highlightMovelist() {
    const lis = elMoves.querySelectorAll("li");
    lis.forEach(li => li.classList.remove("active"));
    if (curPly >= 1) {
      const li = elMoves.querySelector(`li[data-ply="${curPly}"]`);
      if (li) {
        li.classList.add("active");
        keepActiveMoveVisible(li);
      }
    }
  }

  function keepActiveMoveVisible(li) {
    if (!li || !elMovePanel) return;
    const panelRect = elMovePanel.getBoundingClientRect();
    const itemRect = li.getBoundingClientRect();
    const pad = 10;

    if (itemRect.top < panelRect.top + pad) {
      elMovePanel.scrollTop -= (panelRect.top + pad - itemRect.top);
    } else if (itemRect.bottom > panelRect.bottom - pad) {
      elMovePanel.scrollTop += (itemRect.bottom - (panelRect.bottom - pad));
    }
  }

  function updateBranchUI() {
    const ply = curPly; // branch point is "current position ply"
    const varList = kif?.varMap?.get(ply) || null;

    if (!varList || varList.length === 0) {
      elBranchHint.textContent = "分岐：なし";
      elBranchSelect.style.display = "none";
      return;
    }

    const rawSel = Number(branchChoice[ply] ?? 0);
    const sel = (Number.isFinite(rawSel) && rawSel >= 0 && rawSel <= varList.length) ? rawSel : 0;
    if (sel === 0) delete branchChoice[ply];
    else branchChoice[ply] = sel;
    elBranchHint.textContent = `分岐：この局面から ${varList.length} 本`;

    elBranchSelect.innerHTML = "";
    const optMain = document.createElement("option");
    optMain.value = "0";
    optMain.textContent = "本筋（続き）";
    elBranchSelect.appendChild(optMain);

    varList.forEach((v, idx) => {
      const opt = document.createElement("option");
      opt.value = String(idx + 1);
      const head = v.moves[0]?.mvStr || "（空）";
      opt.textContent = `変化${idx+1}：${head}`;
      elBranchSelect.appendChild(opt);
    });

    elBranchSelect.value = String(sel);
    elBranchSelect.style.display = "inline-block";
  }

  function setPly(ply) {
    ply = Math.max(0, Math.min(ply, positions.length-1));
    curPly = ply;
    elSlider.value = String(ply);
    elPlyLabel.textContent = `${ply}手目`;

    const pos = positions[ply];
    renderBoard(pos);
    renderHands(pos);
    highlightMovelist();

    if (ply === 0) elMoveLabel.textContent = "初期局面";
    else {
      const m = pathMoves[ply-1];
      elMoveLabel.textContent = `${ply}. ${m.mvStr}${m.from ? " ("+m.from+")" : ""}`;
    }

    updateBranchUI();
    syncShareUrl();
  }

  function setMeta(meta) {
    const keys = ["棋戦","戦型","開始日時","終了日時","手合割","先手","後手"];
    let out = "";
    for (const k of keys) if (meta[k]) out += `${k}：${meta[k]}\n`;
    elMeta.textContent = out.trim();
  }

  function loadKifText(text) {
    kif = parseKifWithBranches(text);
    branchChoice = {};
    setMeta(kif.meta);
    curPly = 0;
    buildPositions();
  }

  // ---- Export current line as KIF text
  function exportCurrentLineAsKifText() {
    const keys = ["棋戦","戦型","開始日時","終了日時","手合割","先手","後手"];
    let out = "";
    const meta = kif && kif.meta ? kif.meta : {};
    for (const k of keys) if (meta[k]) out += `${k}：${meta[k]}\n`;
    out += "手数----指手---------消費時間--\n";
    const lm = (typeof pathMoves !== "undefined" && Array.isArray(pathMoves)) ? pathMoves : [];
    for (let i = 0; i < lm.length; i++) {
      const m = lm[i];
      const no = i + 1;
      const from = m && m.from ? `(${m.from})` : "";
      const mvStr = m && m.mvStr ? m.mvStr : "";
      out += `${String(no).padStart(3," ")} ${mvStr}${from}\n`;
    }
    try {
      const hasVar = branchChoice && Object.values(branchChoice).some(v => Number(v) > 0);
      if (hasVar) out += "* exported variation\n";
    } catch (_) {}
    return out;
  }

  // ======================================================================
  // 追加機能(1): URLクエリで初期状態を指定  (?kif=...&ply=10&branches=10:1,22:2)
  // 追加機能(2): 局面URL共有（今見てる手数・分岐をリンク化：アドレスバー自動更新）
  // 追加機能(3): CSSだけ差し替え可能（?css=... と軽い上書き ?sq=48&fs=110）
  // ======================================================================

  let loadedKifUrl = null;
  let lastShareUrl = "";

  function parseBranchesParam(raw) {
    const out = {};
    if (!raw) return out;
    for (const token of String(raw).split(",")) {
      const [pRaw, vRaw] = token.split(":");
      const p = Number(pRaw);
      const v = Number(vRaw);
      if (!Number.isFinite(p) || !Number.isFinite(v)) continue;
      if (p < 0 || v <= 0) continue;
      out[p] = v;
    }
    return out;
  }

  function encodeBranchesParam(choiceMap) {
    const entries = Object.entries(choiceMap || {})
      .map(([p, v]) => [Number(p), Number(v)])
      .filter(([p, v]) => Number.isFinite(p) && Number.isFinite(v) && p >= 0 && v > 0)
      .sort((a, b) => a[0] - b[0]);
    if (!entries.length) return "";
    return entries.map(([p, v]) => `${p}:${v}`).join(",");
  }

  function applyThemeFromQuery() {
    try {
      const usp = new URLSearchParams(location.search);

      const cssUrl = usp.get("css");
      if (cssUrl) {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = cssUrl;
        document.head.appendChild(link);
      }

      const sq = usp.get("sq");
      if (sq) {
        const n = Number(sq);
        if (Number.isFinite(n) && n >= 24 && n <= 120) {
          document.documentElement.style.setProperty("--sq", `${n}px`);
        }
      }

      const fs = usp.get("fs");
      if (fs) {
        const n = Number(fs);
        if (Number.isFinite(n) && n >= 50 && n <= 200) {
          document.body.style.fontSize = `${n}%`;
        }
      }
    } catch (_) {}
  }

  async function initFromQueryIfAny() {
    try {
      const usp = new URLSearchParams(location.search);
      const kifParam = usp.get("kif");
      if (!kifParam) return;

      const ply = Number(usp.get("ply") || "0");
      const branchesParam = usp.get("branches");
      const bplyRaw = usp.get("bply");
      const bply = Number((bplyRaw === null || bplyRaw === "") ? (usp.get("ply") || "0") : bplyRaw);
      const branch = Number(usp.get("branch") || "0");

      loadedKifUrl = kifParam;

      const res = await fetch(kifParam, { cache: "no-store" });
      if (!res.ok) return;

      const buf = await res.arrayBuffer();
      const text = decodeKif(buf);
      elKifText.value = text;

      loadKifText(text);

      const parsedBranches = parseBranchesParam(branchesParam);
      if (Object.keys(parsedBranches).length) {
        branchChoice = parsedBranches;
        buildPositions();
      } else if (Number.isFinite(bply) && Number.isFinite(branch) && branch > 0) {
        branchChoice[Math.max(0, bply)] = branch;
        buildPositions();
      }

      if (Number.isFinite(ply)) {
        setPly(Math.max(0, ply));
      }
    } catch (_) {}
  }

  function getCurrentShareUrl() {
    const base = `${location.origin}${location.pathname}`;
    const usp = new URLSearchParams();
    const current = new URLSearchParams(location.search);

    for (const [k, v] of current.entries()) {
      if (k === "ply" || k === "bply" || k === "branch" || k === "branches" || k === "kif") continue;
      usp.append(k, v);
    }

    if (loadedKifUrl) usp.set("kif", loadedKifUrl);

    usp.set("ply", String(curPly));

    try {
      const encoded = encodeBranchesParam(branchChoice);
      if (encoded) {
        usp.set("branches", encoded);
        const first = encoded.split(",")[0]?.split(":");
        if (first && first.length === 2) {
          usp.set("bply", String(Number(first[0])));
          usp.set("branch", String(Number(first[1])));
        }
      }
    } catch (_) {}

    const qs = usp.toString();
    return qs ? `${base}?${qs}` : base;
  }

  function syncShareUrl() {
    try {
      const now = getCurrentShareUrl();
      if (now !== lastShareUrl) {
        lastShareUrl = now;
        history.replaceState(null, "", now);
      }
    } catch (_) {}
  }

  async function copyCurrentUrl() {
    const url = getCurrentShareUrl();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(url);
        alert("局面URLをコピーしたわ。");
      } else {
        alert(url);
      }
    } catch (_) {
      alert(url);
    }
  }

  // buttons
  document.getElementById("btnFirst").addEventListener("click", () => setPly(0));
  document.getElementById("btnPrev").addEventListener("click", () => setPly(curPly-1));
  document.getElementById("btnNext").addEventListener("click", () => setPly(curPly+1));
  document.getElementById("btnLast").addEventListener("click", () => setPly(positions.length-1));
  elSlider.addEventListener("input", (e) => setPly(Number(e.target.value)));

  document.getElementById("btnReset").addEventListener("click", () => {
    if (!kif) {
      kif = { meta:{}, mainMoves:[], varMap:new Map() };
      positions = [initStartpos()];
      elSlider.max = "0";
    }
    branchChoice = {};
    buildPositions();
    setPly(0);
  });

  document.getElementById("btnLoadText").addEventListener("click", () => {
    const t = elKifText.value;
    if (!t.trim()) return;
    loadedKifUrl = null;
    loadKifText(t);
  });

  elFile.addEventListener("change", async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const buf = await f.arrayBuffer();
    const text = decodeKif(buf);
    elKifText.value = text;
    loadedKifUrl = null;
    loadKifText(text);
  });

  document.getElementById("btnSample").addEventListener("click", async () => {
    try {
      const res = await fetch("./piyo_prev_game.kif", { cache: "no-store" });
      if (!res.ok) throw new Error("fetch failed");
      const buf = await res.arrayBuffer();
      const text = decodeKif(buf);
      elKifText.value = text;
      loadedKifUrl = "./piyo_prev_game.kif";
      loadKifText(text);
    } catch (e) {
      alert("サンプルが見つからないわ。リポジトリ直下に piyo_prev_game.kif を置いてね。");
    }
  });

  // branch select
  elBranchSelect.addEventListener("change", () => {
    const v = Number(elBranchSelect.value);
    const ply = curPly;
    if (v > 0) branchChoice[ply] = v; // 1..=variation
    else delete branchChoice[ply];
    for (const key of Object.keys(branchChoice)) {
      if (Number(key) > ply) delete branchChoice[key];
    }
    buildPositions();
    setPly(ply);
  });

  // copy current line KIF
  document.getElementById("btnCopyLineKif").addEventListener("click", async () => {
    const text = exportCurrentLineAsKifText();
    const fallback = () => {
      elKifText.value = text;
      elKifText.focus();
      try {
        elKifText.select();
        elKifText.setSelectionRange(0, elKifText.value.length);
      } catch (_) {}
    };

    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        alert("コピーしたわ。");
      } else {
        fallback();
        alert("コピーできないから、テキスト欄に出したわ。");
      }
    } catch (_) {
      fallback();
      alert("コピーできないから、テキスト欄に出したわ。");
    }
  });

  document.getElementById("btnCopyUrl").addEventListener("click", copyCurrentUrl);

  if (elBoardFrame) {
    elBoardFrame.addEventListener("click", (e) => {
      const rect = elBoardFrame.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width / 2) setPly(curPly - 1);
      else setPly(curPly + 1);
    });
  }

  function isEditableTarget(el) {
    if (!el) return false;
    if (el.isContentEditable) return true;
    const tag = (el.tagName || "").toUpperCase();
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  }

  document.addEventListener("keydown", (e) => {
    if (isEditableTarget(e.target)) return;

    let handled = false;
    if (e.key === "ArrowLeft" || e.key === "h") {
      setPly(curPly - 1);
      handled = true;
    } else if (e.key === "ArrowRight" || e.key === "l") {
      setPly(curPly + 1);
      handled = true;
    } else if (e.key === "ArrowUp") {
      setPly(curPly - 10);
      handled = true;
    } else if (e.key === "ArrowDown") {
      setPly(curPly + 10);
      handled = true;
    } else if (e.key === "Home") {
      setPly(0);
      handled = true;
    } else if (e.key === "End") {
      setPly(positions.length - 1);
      handled = true;
    } else if (e.key === " ") {
      setPly(e.shiftKey ? curPly - 1 : curPly + 1);
      handled = true;
    }

    if (handled) e.preventDefault();
  });

  // initial empty render
  applyThemeFromQuery();
  kif = { meta:{}, mainMoves:[], varMap:new Map() };
  positions = [initStartpos()];
  renderBoard(positions[0]);
  renderHands(positions[0]);
  updateBranchUI();
  syncShareUrl();

  // URL初期化（既存機能に干渉しない）
  initFromQueryIfAny();
})();
</script>
</body>
</html>
